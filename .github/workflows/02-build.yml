name: 02 - Build

on:
  workflow_run:
    workflows: ["01 - Bootstrap"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  TERM: "xterm"

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Display Environment
        run: |
          node --version
          npm --version

      - name: Install Dependencies
        run: npm ci

      - name: Validate Project Files
        run: npm run validate

      - name: Run Formatter
        run: npm run format:check

      - name: Run Project Lint
        run: npm run lint

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Build Project
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Validate Build Entries
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const packageJson = require('./package.json');
          const outputs = [packageJson.main, packageJson.types, ...packageJson.n8n.nodes];
          for (const file of outputs) {
            if (!fs.existsSync(file)) throw new Error(`Missing build artifact: ${file}`);
          }
          NODE

      - name: Generate Build Report
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs/build | Out-Null
          @"
          # Build Report

          Status: SUCCESS

          Formatting, lint, type check, build, tests, and package entries passed.
          Node: $(node --version)
          npm: $(npm --version)
          Generated: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss K")
          "@ | Set-Content logs/build/build-report.md -Encoding utf8

      - name: Upload Build Report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: logs/build/build-report.md
          if-no-files-found: error

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist
            workflows
          if-no-files-found: error

      - name: Build Complete
        run: echo "Build completed successfully."
