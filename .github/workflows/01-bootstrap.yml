name: 01 - Bootstrap

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  TERM: "xterm"

jobs:
  bootstrap:
    name: Bootstrap Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Display Environment
        run: |
          node --version
          npm --version

      - name: Install Dependencies
        run: npm ci

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"

      - name: Validate Architecture Manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest/architecture.json', 'utf8'))"

      - name: Validate Auto-Fix Manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest/auto-fix.json', 'utf8'))"

      - name: Validate Project Structure
        run: npm run validate

      - name: Generate Node Skeletons
        run: npm run validate

      - name: Generate Provider Skeletons
        run: npm run validate

      - name: Validate TypeScript Configuration
        run: node -e "JSON.parse(require('fs').readFileSync('tsconfig.json', 'utf8'))"

      - name: Generate Bootstrap Report
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs/automation | Out-Null
          @"
          # Bootstrap Report

          Status: SUCCESS

          Dependencies installed with npm ci.
          Project structure and manifests validated.
          Node and provider scaffolds validated.
          "@ | Set-Content logs/automation/bootstrap-report.md -Encoding utf8

      - name: Upload Bootstrap Report
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-report
          path: logs/automation/bootstrap-report.md
          if-no-files-found: error

      - name: Bootstrap Complete
        run: echo "Bootstrap completed successfully."
