name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Verify Phase 07 static release prerequisites
        run: npm run verify:phase07:static

      - name: Verify n8n 2.31.6 workflow engine
        run: npm run verify:phase07:engine
        timeout-minutes: 20

      - name: Verify reviewed canary and pilot evidence
        run: npm run verify:phase07:evidence

      - name: Validate tag version
        if: github.ref_type == 'tag'
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

      - name: Build release files
        shell: bash
        run: |
          rm -rf release

          PACK_DIR="${RUNNER_TEMP}/invoicerouter-pack"
          rm -rf "$PACK_DIR"
          mkdir -p "$PACK_DIR"

          npm pack --pack-destination "$PACK_DIR"

          mkdir -p release/bundle/workflows
          mkdir -p release/bundle/templates/common/google-sheets
          mkdir -p release/bundle/templates/odoo
          mkdir -p release/bundle/docs
          mkdir -p release/bundle/examples/google_sheets
          mkdir -p release/bundle/assets/architecture
          mkdir -p release/bundle/evidence/phase07
          mkdir -p release/bundle/scripts
          mkdir -p release/bundle/tests/fixtures/n8n
          mkdir -p release/bundle/tests/fixtures/odoo

          cp README.md ARCHITECTURE.md CHANGELOG.md PROJECT_STRUCTURE.md VERSION_1_0_FREEZE.md LICENSE release/bundle/
          cp manifest/freeze-v1.0.json release/bundle/

          cp workflows/InvoiceRouter-v1-production.json release/bundle/workflows/
          cp workflows/InvoiceRouter-v1.6-simple-bulk-email.json release/bundle/workflows/
          cp workflows/InvoiceRouter-v2-master-universal.json release/bundle/workflows/

          cp -R template/providers/odoo/. release/bundle/templates/odoo/
          cp template/status-writeback-columns.csv release/bundle/templates/common/
          cp template/google-sheets/auto-fix-invoice-results-headers.gs release/bundle/templates/common/google-sheets/

          cp -R docs/user release/bundle/docs/
          cp -R docs/developer release/bundle/docs/
          cp -R docs/troubleshooting release/bundle/docs/
          cp docs/index.md docs/docs.minifest.ygit release/bundle/docs/

          cp examples/google_sheets/InvoiceRouter_20_Provider_Production_Presets_v1.0.xlsx release/bundle/examples/google_sheets/
          cp assets/architecture/invoice-router-architecture-v1.0.png release/bundle/assets/architecture/

          cp evidence/phase07/*.json evidence/phase07/*.md release/bundle/evidence/phase07/
          cp scripts/phase07-n8n-engine-smoke.mjs scripts/phase07-final-release-gate.mjs release/bundle/scripts/
          cp tests/fixtures/n8n/InvoiceRouter-Phase-07-Engine-Smoke.json release/bundle/tests/fixtures/n8n/
          cp tests/fixtures/odoo/odoo-18-phase07-e2e.json tests/fixtures/odoo/odoo-19-phase07-e2e.json release/bundle/tests/fixtures/odoo/

          node scripts/audit-release-source.mjs release/bundle

          find release/bundle -type f -printf '%P\n' | sort > release/bundle/BUNDLE_CONTENTS.txt

          cp "$PACK_DIR"/n8n-nodes-invoicerouter-*.tgz release/
          cp "$PACK_DIR"/n8n-nodes-invoicerouter-*.tgz release/bundle/

          VERSION="$(node -p "require('./package.json').version")"

          (
            cd release/bundle
            zip -r "../InvoiceRouter-v${VERSION}-install-bundle.zip" .
          )

          (
            cd release
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS.txt
          )

          rm -rf "$PACK_DIR"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceRouter-release
          path: release/**
          if-no-files-found: error

      - name: Validate npm publication credentials
        if: github.ref_type == 'tag'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "NPM_TOKEN is required for a tag release." >&2
            exit 1
          fi
          npm whoami --registry=https://registry.npmjs.org

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.tgz
            release/*-install-bundle.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: Publish package to npm
        if: github.ref_type == 'tag'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "NPM_TOKEN is required for a tag release." >&2
            exit 1
          fi
          npm publish --access public --provenance
