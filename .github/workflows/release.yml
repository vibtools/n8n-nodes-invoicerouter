name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Validate tag version
        if: github.ref_type == 'tag'
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

      - name: Build release files
        shell: bash
        run: |
          rm -rf release

          PACK_DIR="${RUNNER_TEMP}/invoicerouter-pack"
          rm -rf "$PACK_DIR"
          mkdir -p "$PACK_DIR"

          npm pack --pack-destination "$PACK_DIR"

          mkdir -p release/bundle/workflows
          mkdir -p release/bundle/examples/google_sheets
          mkdir -p release/bundle/assets/architecture

          cp "$PACK_DIR"/n8n-nodes-invoicerouter-*.tgz release/
          cp "$PACK_DIR"/n8n-nodes-invoicerouter-*.tgz release/bundle/

          cp README.md ARCHITECTURE.md VERSION_1_0_FREEZE.md release/bundle/
          cp manifest/freeze-v1.0.json release/bundle/
          cp workflows/InvoiceRouter-v1-production.json release/bundle/workflows/
          cp examples/google_sheets/InvoiceRouter_20_Provider_Production_Presets_v1.0.xlsx release/bundle/examples/google_sheets/
          cp assets/architecture/invoice-router-architecture-v1.0.png release/bundle/assets/architecture/

          VERSION="$(node -p "require('./package.json').version")"

          (
            cd release/bundle
            zip -r "../InvoiceRouter-v${VERSION}-install-bundle.zip" .
          )

          (
            cd release
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS.txt
          )

          rm -rf "$PACK_DIR"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceRouter-release
          path: release/**
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.tgz
            release/*-install-bundle.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: Publish to npm when token exists
        if: github.ref_type == 'tag'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "${NODE_AUTH_TOKEN}" ]]; then
            npm publish --access public --provenance
          else
            echo "NPM_TOKEN is not configured; npm publishing was skipped."
          fi
