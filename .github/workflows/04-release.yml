name: 04 - Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

env:
  NODE_VERSION: "24"
  TERM: "xterm"

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Validate Release Files
        run: |
          npm run validate
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
          fi

      - name: Check Formatting
        run: npm run format:check

      - name: Run Lint and Type Check
        run: |
          npm run lint
          npm run typecheck

      - name: Build Project
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Package Project
        run: |
          npm pack
          compgen -G "*.tgz" > /dev/null

      - name: Generate Release Report
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs/release | Out-Null
          @"
          # Release Report

          Status: SUCCESS

          Validation, build, tests, and npm packaging completed.
          Generated: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss K")
          "@ | Set-Content logs/release/release-report.md -Encoding utf8

      - name: Upload Release Report
        uses: actions/upload-artifact@v4
        with:
          name: release-report
          path: logs/release/release-report.md
          if-no-files-found: error

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: "*.tgz"
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "*.tgz"
          fail_on_unmatched_files: true

      - name: Publish to npm
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Release Complete
        run: echo "Release workflow completed successfully."
