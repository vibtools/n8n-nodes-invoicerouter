name: 04 - Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

env:
  NODE_VERSION: "24"
  TERM: "xterm"

jobs:
  release:
    name: Build Production Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Validate Tag Version
        shell: bash
        run: |
          npm run validate
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
          fi

      - name: Verify Production Build
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run build
          npm test
          npm pack --dry-run

      - name: Create Release Bundle
        shell: bash
        run: |
          rm -rf release
          mkdir -p release/workflows
          npm pack --pack-destination release
          cp workflows/*.json release/workflows/
          cp workflows/README.md release/workflows/
          (
            cd release
            find . -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )
          find release -maxdepth 2 -type f -print

      - name: Generate Release Report
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs/release | Out-Null
          @"
          # Release Report

          Status: SUCCESS

          Production validation, TypeScript build, tests, npm packaging,
          workflow export, and checksums completed.

          Package version: $(node -p "require('./package.json').version")
          Node version: $(node --version)
          Generated: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss K")
          "@ | Set-Content logs/release/release-report.md -Encoding utf8

      - name: Upload Production Package
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceRouter-production-release
          path: |
            release/**
            logs/release/release-report.md
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.tgz
            release/SHA256SUMS.txt
            release/workflows/*.json
            release/workflows/README.md
          fail_on_unmatched_files: true

      - name: Publish to npm When Token Exists
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "${NODE_AUTH_TOKEN}" ]]; then
            npm publish --access public --provenance
          else
            echo "NPM_TOKEN is not configured; GitHub Release assets were created and npm publish was skipped."
          fi

      - name: Release Complete
        run: echo "Production release workflow completed successfully."
