name: 03 - Documentation

on:
  workflow_run:
    workflows: ["02 - Build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  TERM: "xterm"

jobs:
  documentation:
    name: Validate Documentation
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Verify Documentation Directories
        run: test -d docs && test -d user-docs

      - name: Verify Required Documentation Files
        run: |
          test -s README.md
          test -s CHANGELOG.md
          test -s ARCHITECTURE.md
          test -s docs/README.md
          test -s docs/API.md
          test -s docs/INSTALL.md
          test -s docs/DEVELOPER_GUIDE.md
          test -s user-docs/README.md
          test -s user-docs/index.md

      - name: Validate Markdown Files
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const walk = (directory) =>
            fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) =>
              entry.isDirectory()
                ? walk(path.join(directory, entry.name))
                : [path.join(directory, entry.name)],
            );
          const markdownFiles = [
            'README.md',
            'CHANGELOG.md',
            'ARCHITECTURE.md',
            ...walk('docs'),
            ...walk('user-docs'),
          ].filter((file) => file.endsWith('.md'));
          for (const file of markdownFiles) {
            if (!fs.statSync(file).size) throw new Error(`Empty Markdown: ${file}`);
          }
          NODE

      - name: Validate Manifest Files
        run: npm run validate

      - name: Build Documentation Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs/docs | Out-Null
          @"
          # Documentation Report

          Status: SUCCESS

          Required documentation and manifests validated.
          Generated: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss K")
          "@ | Set-Content logs/docs/documentation-report.md -Encoding utf8

      - name: Upload Documentation Report
        uses: actions/upload-artifact@v4
        with:
          name: documentation-report
          path: logs/docs/documentation-report.md
          if-no-files-found: error

      - name: Upload Documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: |
            ARCHITECTURE.md
            CHANGELOG.md
            docs
            user-docs
          if-no-files-found: error

      - name: Documentation Complete
        run: echo "Documentation validation completed successfully."
